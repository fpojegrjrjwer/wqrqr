  inset: 0px;
}

.inline-block{
  display: inline-block;
}

.flex{
  display: flex;
}

.hidden{
  display: none;
}

.transform{
  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}

.border{
  border-width: 1px;
}

:root {
  --surface: #eef1f4;
  --panel: #ffffff;
  --ink: #17233b;
  --muted: #667085;
  --line: #cbd5e1;
  --navy: #1e3a5f;
  --blue: #2563eb;
  --green: #15803d;
}

@media (prefers-color-scheme: dark) {
  :root {
    --surface: #11161f;
    --panel: #1a2230;
    --ink: #edf1f7;
    --muted: #a8b3c3;
    --line: #344054;
    --navy: #9db8dd;
    --blue: #6aa5ff;
    --green: #4ade80;
  }
}

* {
  box-sizing: border-box;
}

html, body, #root {
  margin: 0;
  min-height: 100%;
}

body {
  font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif;
  color: var(--ink);
  background: var(--surface);
}

.font-display {
  font-family: 'Space Grotesk', 'Manrope', ui-sans-serif, sans-serif;
}

.canvas-grid {
  background-color: #f6f8fa;
  background-image:
    linear-gradient(rgba(30,58,95,.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(30,58,95,.07) 1px, transparent 1px);
  background-size: 28px 28px;
}

@media (prefers-color-scheme: dark) {
  .canvas-grid {
    background-color: #151b26;
    background-image: linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
  }
}

.node-shadow {
  box-shadow: 0 8px 22px rgba(15, 35, 65, .14), 0 2px 5px rgba(15, 35, 65, .08);
}

button {
  font-family: inherit;
}

button:active {
  transform: translateY(1px);
}
